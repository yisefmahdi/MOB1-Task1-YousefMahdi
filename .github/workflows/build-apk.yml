name: Build Android APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-birthday-card:
    name: Build 01 - Birthday Card
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x 01_BirthdayCard/gradlew

      - name: Build Debug APK
        working-directory: 01_BirthdayCard
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Birthday Card APK
        uses: actions/upload-artifact@v4
        with:
          name: 01-BirthdayCard-debug-APK
          path: 01_BirthdayCard/app/build/outputs/apk/debug/app-debug.apk
