        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x 03_Quadrant/gradlew

      - name: Build Debug APK
        working-directory: 03_Quadrant
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Quadrant APK
        uses: actions/upload-artifact@v4
        with:
          name: 03-Quadrant-debug-APK
          path: 03_Quadrant/app/build/outputs/apk/debug/app-debug.apk

  build-article:
    name: Build 04 - Article
    runs-on: ubuntu-latest

    steps:
